name: Release

# Publica una Release cuando la versión del plugin cambia en main (o al subir una
# etiqueta vX.Y.Z). El actualizador del plugin solo ofrece Releases.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Versión del plugin y estado de la Release
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          HDR=$(grep -m1 -oP '^\s*\*\s*Version:\s*\K[0-9.]+' site-uptime-watcher.php)
          CONST=$(grep -m1 -oP "SUW_VERSION', '\K[0-9.]+" site-uptime-watcher.php)
          echo "cabecera=$HDR constante=$CONST"
          [ -n "$HDR" ] && [ "$HDR" = "$CONST" ] || { echo "::error::La cabecera y SUW_VERSION no coinciden"; exit 1; }
          TAG="v$HDR"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "$TAG" ]; then
            echo "::error::La etiqueta $GITHUB_REF_NAME no coincide con la versión $HDR"; exit 1
          fi
          # En main solo se publica si esa versión aún no tiene Release.
          if [ "$GITHUB_REF_TYPE" = "branch" ] && gh release view "$TAG" >/dev/null 2>&1; then
            echo "La Release $TAG ya existe: nada que publicar."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: shivammathur/setup-php@v2
        if: steps.meta.outputs.publish == 'true'
        with:
          php-version: '7.4'

      - name: Comprobar sintaxis PHP
        if: steps.meta.outputs.publish == 'true'
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l

      - name: Ejecutar tests
        if: steps.meta.outputs.publish == 'true'
        run: php tests/run.php

      - name: Empaquetar ZIP
        if: steps.meta.outputs.publish == 'true'
        run: |
          mkdir -p /tmp/pkg/site-uptime-watcher
          rsync -a --exclude='.git' --exclude='.github' --exclude='.gitignore' --exclude='tests' ./ /tmp/pkg/site-uptime-watcher/
          (cd /tmp/pkg && zip -qr "$GITHUB_WORKSPACE/site-uptime-watcher.zip" site-uptime-watcher)

      - name: Publicar Release
        if: steps.meta.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" site-uptime-watcher.zip --clobber
          else
            gh release create "$TAG" site-uptime-watcher.zip --target "$GITHUB_SHA" --title "$TAG" --generate-notes
          fi
